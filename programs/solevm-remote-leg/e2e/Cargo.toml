[package]
name = "solevm-e2e"
version = "0.1.0"
description = "Deterministic Solana–EVM end-to-end transport and remote-leg driver"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/ayushkumarmishra/solana-evm-cross-chain-vault"
publish = false

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token"] }
base64 = "0.22"
litesvm = "=0.15.2"
protocol-types = { path = "../../../crates/protocol-types", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.5"
solana-transaction-error = "=3.3.1"
solevm-remote-leg = { path = "..", features = ["no-entrypoint"] }
solevm-test-strategy = { path = "../test-strategy", features = ["no-entrypoint"] }
xchain-sim = { path = "../../../crates/xchain-sim" }

[lints]
workspace = true
