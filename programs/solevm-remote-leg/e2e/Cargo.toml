[package]
name = "solevm-e2e"
version = "0.1.0"
description = "Deterministic Solana–EVM end-to-end transport and remote-leg driver"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/ayushmishra2005/solana-evm-cross-chain-vault"
publish = false

[dependencies]
anchor-lang = "=1.2.1"
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token"] }
base64 = "0.22"
litesvm = { version = "=0.18.1", features = ["precompiles"] }
es256-authorization-verifier = { path = "../../authorization-verifier", features = ["no-entrypoint"] }
es256-jws-adapter = { path = "../../authorization-verifier/adapter" }
protocol-types = { path = "../../../crates/protocol-types", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "=4.7.0"
solana-instruction = "=3.5.1"
solana-instructions-sysvar = "=3.0.1"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-transaction-error = "=3.4.0"
solevm-remote-leg = { path = "..", features = ["no-entrypoint"] }
solevm-test-strategy = { path = "../test-strategy", features = ["no-entrypoint"] }
xchain-sim = { path = "../../../crates/xchain-sim" }

[lints]
workspace = true
