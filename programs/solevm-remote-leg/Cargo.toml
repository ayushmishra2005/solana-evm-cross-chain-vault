[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
# The program macro reads this target when it builds for the chain.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"

[package]
name = "solevm-remote-leg"
version = "0.1.0"
description = "Solana strategy leg controlled by the canonical EVM vault"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/ayushkumarmishra/solana-evm-cross-chain-vault"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token"] }
protocol-types = { path = "../../crates/protocol-types", default-features = false }

[dev-dependencies]
# Tests build canonical messages, so they need the owned encoder.
protocol-types = { path = "../../crates/protocol-types", features = ["std"] }
litesvm = "=0.15.2"
mollusk-svm = "=0.14.0"
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.5"
solana-transaction-error = "=3.3.1"

[lints]
workspace = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
