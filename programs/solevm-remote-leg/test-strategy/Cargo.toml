[package]
name = "solevm-test-strategy"
version = "0.1.0"
description = "Deterministic strategy adapter used to exercise remote leg CPI"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/ayushmishra2005/solana-evm-cross-chain-vault"

[lib]
crate-type = ["cdylib", "lib"]
name = "solevm_test_strategy"

[features]
default = []
# Misbehaves on the amounts in `attack`, for adversarial tests only.
hostile = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.1"
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token"] }

[lints]
workspace = true
