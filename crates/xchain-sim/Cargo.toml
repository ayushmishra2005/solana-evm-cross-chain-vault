[package]
name = "xchain-sim"
version = "0.1.0"
description = "Deterministic transport simulator for SolEVM Vault control messages and asset transfers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
protocol-types = { path = "../protocol-types", default-features = false }

[dev-dependencies]
proptest = "=1.11.0"

[features]
# Without features the crate is no_std and uses alloc only.
default = ["std"]
std = ["protocol-types/std"]

[lints]
workspace = true
