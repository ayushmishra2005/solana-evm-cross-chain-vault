name: ES256 authorization verifier

on:
  push:
    branches: [ "main" ]
    paths:
      - "examples/es256-authorization-verifier/**"
      - ".github/workflows/es256-authorization-verifier.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "examples/es256-authorization-verifier/**"
      - ".github/workflows/es256-authorization-verifier.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_SBF_VERSION: 4.4.0
  PLATFORM_TOOLS_VERSION: v1.58

jobs:
  sbpf-v0:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/es256-authorization-verifier

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Install cargo-build-sbf
      run: cargo install cargo-build-sbf --version "$CARGO_BUILD_SBF_VERSION" --locked
    - name: Build SBPFv0 programs
      run: |
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0 \
          --manifest-path test-programs/cpi-forwarder/Cargo.toml --sbf-out-dir target/deploy
    - name: Check the build left Cargo.lock unchanged
      run: git diff --exit-code -- Cargo.lock
    - name: Format
      run: cargo fmt --all --check
    - name: Lint
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - name: Run tests against SBPFv0
      env:
        SBF_OUT_DIR: ${{ github.workspace }}/examples/es256-authorization-verifier/target/deploy
        ES256_EXPECTED_SBPF_ARCH: v0
      run: cargo test --locked --workspace --all-features

  sbpf-v3:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/es256-authorization-verifier

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Install cargo-build-sbf
      run: cargo install cargo-build-sbf --version "$CARGO_BUILD_SBF_VERSION" --locked
    - name: Build SBPFv3 programs
      run: |
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 --sbf-out-dir target/deploy-v3
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 \
          --manifest-path test-programs/cpi-forwarder/Cargo.toml --sbf-out-dir target/deploy-v3
    - name: Check the build left Cargo.lock unchanged
      run: git diff --exit-code -- Cargo.lock
    - name: Run tests against SBPFv3
      env:
        SBF_OUT_DIR: ${{ github.workspace }}/examples/es256-authorization-verifier/target/deploy-v3
        ES256_EXPECTED_SBPF_ARCH: v3
      run: cargo test --locked --workspace --all-features
