name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_SBF_VERSION: 4.4.0
  PLATFORM_TOOLS_VERSION: v1.58

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Format
      run: cargo fmt --all --check
    - name: Lint
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test --locked --workspace --all-features

  solana:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/solevm-remote-leg

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Install cargo-build-sbf
      run: cargo install cargo-build-sbf --version "$CARGO_BUILD_SBF_VERSION" --locked
    - name: Build SBPFv0 programs
      run: |
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0 \
          --manifest-path test-strategy/Cargo.toml --sbf-out-dir target/deploy
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0 \
          --manifest-path test-strategy/Cargo.toml --features hostile --sbf-out-dir target/deploy-hostile
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0 \
          --manifest-path ../authorization-verifier/Cargo.toml --sbf-out-dir target/deploy
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v0 \
          --manifest-path ../authorization-verifier/test-programs/cpi-forwarder/Cargo.toml --sbf-out-dir target/deploy
    - name: Check the builds left Cargo.lock unchanged
      run: git diff --exit-code -- Cargo.lock ../authorization-verifier/Cargo.lock
    - name: Format
      run: cargo fmt --all --check
    - name: Lint
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - name: Run tests
      env:
        SOLEVM_EXPECTED_SBPF_ARCH: v0
      run: cargo test --locked --workspace --all-features
    - name: Devnet driver
      working-directory: programs/solevm-remote-leg/devnet
      run: |
        cargo fmt --check
        cargo clippy --locked --all-targets -- -D warnings
        cargo test --locked
    - name: Devnet scripts
      working-directory: scripts/devnet
      run: shellcheck -x -P SCRIPTDIR -s bash *.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: sbf-v0
        path: programs/solevm-remote-leg/target/deploy/*.so
        if-no-files-found: error

  solana-sbpf-v3:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/solevm-remote-leg

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Install cargo-build-sbf
      run: cargo install cargo-build-sbf --version "$CARGO_BUILD_SBF_VERSION" --locked
    - name: Build SBPFv3 programs
      run: |
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 --sbf-out-dir target/deploy-v3
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 \
          --manifest-path test-strategy/Cargo.toml --sbf-out-dir target/deploy-v3
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 \
          --manifest-path test-strategy/Cargo.toml --features hostile --sbf-out-dir target/deploy-hostile-v3
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 \
          --manifest-path ../authorization-verifier/Cargo.toml --sbf-out-dir target/deploy-v3
        cargo-build-sbf --tools-version "$PLATFORM_TOOLS_VERSION" --arch v3 \
          --manifest-path ../authorization-verifier/test-programs/cpi-forwarder/Cargo.toml --sbf-out-dir target/deploy-v3
    - name: Check the builds left Cargo.lock unchanged
      run: git diff --exit-code -- Cargo.lock ../authorization-verifier/Cargo.lock
    - name: Run tests against SBPFv3
      env:
        SBF_OUT_DIR: ${{ github.workspace }}/programs/solevm-remote-leg/target/deploy-v3
        HOSTILE_SBF_OUT_DIR: ${{ github.workspace }}/programs/solevm-remote-leg/target/deploy-hostile-v3
        SOLEVM_EXPECTED_SBPF_ARCH: v3
      run: cargo test --locked --workspace --all-features

  foundry:

    needs: solana
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/solevm-vault

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: sbf-v0
        path: programs/solevm-remote-leg/target/deploy
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: v1.8.6
    - name: Install Solidity dependencies
      run: |
        forge install foundry-rs/forge-std@bf647bd6046f2f7da30d0c2bf435e5c76a780c1b --no-git --shallow # v1.16.2
        forge install OpenZeppelin/openzeppelin-contracts@cab19933c33c2ad1d4c7a84864a3601dddfd16f3 --no-git --shallow # v5.7.0
    - name: Format
      run: forge fmt --check
    - name: Build
      run: forge build
    - name: Unit, fuzz, invariant and cross-chain E2E tests
      run: forge test
    - name: Rust model differential tests
      env:
        RUN_DIFFERENTIAL: 1
        FOUNDRY_PROFILE: differential
      run: forge test --match-contract RustModelDifferentialTest -vv
