[workspace]
resolver = "3"
members = ["adapter"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"

[package]
name = "es256-authorization-verifier"
version = "0.1.0"
description = "Standalone Solana program that consumes ES256-signed authorization verdicts"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/ayushmishra2005/solana-evm-cross-chain-vault"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.1"
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
es256-jws-adapter = { path = "adapter" }
litesvm = { version = "=0.18.1", features = ["precompiles"] }
solana-account = "=4.7.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-precompile-error = "=3.0.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-transaction-error = "=3.4.0"

[lints]
workspace = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
