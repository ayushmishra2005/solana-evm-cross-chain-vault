[package]
name = "es256-verifier-devnet"
version = "0.1.0"
description = "Runs the ES256 verifier's consume-and-replay flow on Solana devnet"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

# Kept out of the example workspace so its lockfile and CI stay unchanged.
[workspace]

[dependencies]
anchor-lang = "=1.2.1"
base64 = "0.22"
bincode = "1.3"
es256-authorization-verifier = { path = "..", features = ["no-entrypoint"] }
es256-jws-adapter = { path = "../adapter" }
serde_json = "1"
solana-hash = "=4.6.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-transaction = { version = "=4.3.0", features = ["blake3", "serde"] }
ureq = { version = "3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
